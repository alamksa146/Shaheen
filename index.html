<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shaheen Mart POS</title>
  
  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #eceff3; --surface: #ffffff; --ink: #101a26; --muted: #64748b;
      --brand: #1d4e89; --brand-ink: #ffffff; --tag: #ffc933;
      --danger: #c0392b; --ok: #1c8a4e; --warn: #b36b00; --soft: #f1f5f9;
      --shadow: 0 1px 2px rgba(16,26,38,.08), 0 8px 24px rgba(16,26,38,.06);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e141b; --surface: #17202a; --ink: #eaf0f6; --muted: #8b9eb0;
        --brand: #5b9bdc; --brand-ink: #06121f; --tag: #ffc933;
        --danger: #ff7a6b; --ok: #4cc884; --warn: #f0a63a; --soft: #1e2936;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e141b; --surface: #17202a; --ink: #eaf0f6; --muted: #8b9eb0;
      --brand: #5b9bdc; --brand-ink: #06121f; --tag: #ffc933;
      --danger: #ff7a6b; --ok: #4cc884; --warn: #f0a63a; --soft: #1e2936;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .container { max-width: 1000px; margin: 0 auto; padding: 15px; }
    .card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
    h1, h2, h3 { margin-top: 0; }
    .btn { background: var(--brand); color: var(--brand-ink); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #fff; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid var(--muted); border-radius: 6px; background: var(--surface); color: var(--ink); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border-bottom: 1px solid var(--soft); padding: 8px; text-align: left; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; background: var(--ok); color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>Shaheen Mart POS</h2>
      <p>Cloud Live Syncing: <span id="sync-status" class="status-badge" style="background:var(--warn)">Connecting...</span></p>
    </div>

    <!-- Live Invoices Section -->
    <div class="card">
      <h3>Live Invoices</h3>
      <div id="invoices-list">Loading invoices...</div>
    </div>
  </div>

  <script>
    // 1. Firebase Credentials Setup
    const firebaseConfig = {
      apiKey: "AIzaSyDzGlCaPPRywNjci8WKNX61biqhfpTqVO0",
      authDomain: "shaheen-d6ead.firebaseapp.com",
      projectId: "shaheen-d6ead",
      storageBucket: "shaheen-d6ead.firebasestorage.app",
      messagingSenderId: "1098759592110",
      appId: "1:1098759592110:web:69b0031c873ad0dc3fb53f",
      databaseURL: "https://shaheen-d6ead-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Connection Status Sync
    const statusBadge = document.getElementById("sync-status");
    db.ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        statusBadge.textContent = "Live Online";
        statusBadge.style.background = "var(--ok)";
      } else {
        statusBadge.textContent = "Offline / Reconnecting";
        statusBadge.style.background = "var(--warn)";
      }
    });

    // 2. Realtime Listener to Sync Invoices Across Devices
    db.ref("invoices").on("value", (snapshot) => {
      const data = snapshot.val();
      const listContainer = document.getElementById("invoices-list");
      
      if (!data) {
        listContainer.innerHTML = "<p>Koi invoice nahi mila.</p>";
        return;
      }

      let html = "<table><thead><tr><th>Invoice ID</th><th>Total</th><th>Date</th></tr></thead><tbody>";
      const invoices = Object.values(data);
      
      invoices.reverse().forEach((inv) => {
        html += `<tr>
          <td>#${inv.id || 'N/A'}</td>
          <td>${inv.total || 0} SAR</td>
          <td>${inv.date || 'N/A'}</td>
        </tr>`;
      });
      
      html += "</tbody></table>";
      listContainer.innerHTML = html;
    });

    // 3. Global Function to Add Invoice To Cloud
    function saveInvoiceToCloud(invoiceData) {
      if (!invoiceData.id) {
        invoiceData.id = "INV-" + Date.now();
      }
      db.ref("invoices/" + invoiceData.id).set(invoiceData)
        .then(() => {
          console.log("Invoice synced successfully!");
        })
        .catch((err) => {
          console.error("Firebase Sync Error: ", err);
        });
    }
  </script>
</body>
</html>
